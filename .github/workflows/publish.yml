name: publish to nuget

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: build, pack & publish
    runs-on: windows-latest
    env:
      Configuration: Release
      BuildType: V2
      BuildNumber: ${{ github.run_number }}
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Set Version
        run: |
          $version='${{ github.ref_name }}'.TrimStart('v')
          Add-Content -Path $env:GITHUB_ENV -Value "Version=$version"
      - name: Set NugetFile
        run: Add-Content -Path $env:GITHUB_ENV -Value "NugetFile=./IndicoV2/bin/Release/IndicoClient.${{ env.Version }}.nupkg"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.404'
      - name: Pack
        run: dotnet pack ./IndicoV2/IndicoV2.csproj
      - name: Push
        run: dotnet nuget push ${{ env.NugetFile }} -s https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
