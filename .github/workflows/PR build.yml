name: PR build

on:
  pull_request:

jobs:
  build:

    runs-on: windows-latest
    
    env:
      Configuration: Release
      BuildType: V2
      BuildNumber: ${{ github.run_number }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.404'
    - name: Build
      run: dotnet build
    - name: Test
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory:"./coverage/" --filter FullyQualifiedName\!~IntegrationTests -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
    - name: Generate report
      uses: danielpalme/ReportGenerator-GitHub-Action@2487f212a1db1c6b190912faea77b26f850537b1 # 4.8.5
      with:
        targetdir: ./coverage/
        reporttypes: lcov
        reports: ./coverage/*/coverage.*
        assemblyFilters: -Indico
    - name: Filter lcov to reduce comment size
      run: bash scripts/filter-lcov.sh ./coverage/lcov.info
    - name: Post code coverage report
      uses: romeovs/lcov-reporter-action@5f20a0bee24993af3b153eed0c999329187079f1 # v0.2.16
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        lcov-file: ./coverage/lcov.info
        filter-changed-files: true
